# Draws a pixel-art koi from this account's public GitHub activity, nightly.
# See https://github.com/yalongwastaken/git-koi.
#
# Until the pond (lily pads for the week's issues, rocks for its pull requests)
# is released upstream, this builds git-koi from the `pond` branch of the
# jrkubic/git-koi fork instead of using the published Action. Switch back to
# `yalongwastaken/git-koi@v1` once a release carries it.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out git-koi with the pond
        uses: actions/checkout@v7
        with:
          repository: jrkubic/git-koi
          ref: pond
          path: git-koi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: git-koi
      - name: Build git-koi
        run: cargo +stable build --release --locked --manifest-path git-koi/Cargo.toml
      - name: Collect the account snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git-koi/target/release/git-koi collect "$GITHUB_REPOSITORY_OWNER" \
            --output "$RUNNER_TEMP/koi-snapshot.json"
      - name: Render the koi
        run: |
          git-koi/target/release/git-koi render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir koi --body asagi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
